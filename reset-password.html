<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Reset Password — DeafWork</title>
<meta name="robots" content="noindex"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#0b3d62;background:#f0f6fb}
body{margin:0;padding:0}
header{background:#0b3d62;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;font-weight:700}
.wrap{max-width:520px;margin:40px auto;padding:0 24px 60px}
.card{background:#fff;border:1px solid #d3e2ed;border-radius:14px;padding:28px}
h1{font-size:24px;margin:0 0 8px}
p{color:#4a6a82;font-size:15px;line-height:1.5}
label{font-weight:700;font-size:14px;display:block;margin-top:16px}
input{width:100%;border:1px solid #ccdae7;border-radius:8px;padding:12px;margin:6px 0 4px;box-sizing:border-box;font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:14px 28px;font-weight:700;font-size:16px;background:#0b3d62;color:#fff;width:100%;margin-top:16px}
button:disabled{opacity:.6;cursor:wait}
.msg{border-radius:8px;padding:14px 18px;margin-top:20px;font-size:15px;display:none}
.msg.ok{background:#e8f5e9;border-left:4px solid #2a9d5a;color:#1b5e20}
.msg.err{background:#fdecea;border-left:4px solid #c0392b;color:#7a1f1f}
</style>
</head>
<body>
<header>
  <a href="/">🤟 DeafWork</a>
  <a href="/">← Back to DeafWork</a>
</header>
<div class="wrap">
  <div class="card" id="requestCard">
    <h1>Forgot your password?</h1>
    <p>Type the email you use for DeafWork and we’ll email you a link to set a new password. The Deaf Pulse uses the same account, so this fixes both.</p>
    <label>Your email
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com"/>
    </label>
    <button id="sendBtn">Email me a reset link</button>
    <div class="msg" id="reqMsg"></div>
  </div>

  <div class="card" id="setCard" style="display:none">
    <h1>Set a new password</h1>
    <p>You opened the reset link — now choose a new password (6+ characters).</p>
    <label>New password
      <input id="newpass" type="password" autocomplete="new-password" placeholder="6+ characters"/>
    </label>
    <button id="saveBtn">Save new password</button>
    <div class="msg" id="setMsg"></div>
  </div>
</div>
<script>
const sb = supabase.createClient(
  "https://vdxncfcgtguzmsncjovl.supabase.co",
  "sb_publishable_77Lm7XoBtEBCrcfjcsGb1g_wZSk0Wap"
);
const $ = id => document.getElementById(id);
function show(el, msg, ok) {
  el.textContent = msg;
  el.className = "msg " + (ok ? "ok" : "err");
  el.style.display = "block";
}

$("sendBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();
  if (!email) { show($("reqMsg"), "Type your email above first.", false); return; }
  const btn = $("sendBtn");
  btn.disabled = true; btn.textContent = "Sending…";
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: location.origin + "/reset-password.html"
  });
  btn.disabled = false; btn.textContent = "Email me a reset link";
  if (error) show($("reqMsg"), "That didn't send — check the email address and try again.", false);
  else show($("reqMsg"), "Check your email for a reset link. Tap it to set a new password.", true);
});

sb.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY") {
    $("requestCard").style.display = "none";
    $("setCard").style.display = "block";
  }
});

$("saveBtn").addEventListener("click", async () => {
  const pw = $("newpass").value;
  if (!pw || pw.length < 6) { show($("setMsg"), "Password needs 6+ characters.", false); return; }
  const btn = $("saveBtn");
  btn.disabled = true; btn.textContent = "Saving…";
  const { error } = await sb.auth.updateUser({ password: pw });
  btn.disabled = false; btn.textContent = "Save new password";
  if (error) show($("setMsg"), "That didn't save — the reset link may have expired. Request a new one above.", false);
  else show($("setMsg"), "Password saved — you are logged in. Head back to DeafWork and sign in with your new password.", true);
});
</script>
</body>
</html>
